<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaiyanStrong Coach — Checkout</title>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  #status {
    max-width: 420px;
  }
  h1 {
    color: #f5a623;
    font-size: 20px;
    letter-spacing: 1px;
  }
  p {
    color: rgba(255, 255, 255, 0.6);
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="status">
    <h1>SAIYAN STRONG COACH</h1>
    <p id="message">Loading checkout…</p>
  </div>

  <script>
    // Paddle vendor: barbell-io org. Client-side token is public by design (embedded
    // in frontend JS) — it can only start a checkout, never read/write account data.
    var PADDLE_CLIENT_TOKEN = "live_b249b77bdfbe152b64f7c6ab2f1";
    var PRICE_IDS = {
      monthly: "pri_01kx3sanwbq4ntdt8padspb2xm",
      annual: "pri_01kx3sdaqgx2mt5kgn623cjthq"
    };

    var params = new URLSearchParams(window.location.search);
    var uid = params.get("uid");
    var plan = params.get("plan") === "annual" ? "annual" : "monthly";
    var messageEl = document.getElementById("message");

    if (!uid) {
      messageEl.textContent = "Missing account info — open this page from the SaiyanStrong app (Settings → Coach Mode → Upgrade).";
    } else {
      Paddle.Environment.set("production");
      Paddle.Initialize({ token: PADDLE_CLIENT_TOKEN });

      messageEl.textContent = "Opening checkout…";

      Paddle.Checkout.open({
        items: [{ priceId: PRICE_IDS[plan], quantity: 1 }],
        customData: { supabase_user_id: uid },
        settings: {
          displayMode: "overlay",
          successUrl: window.location.origin + window.location.pathname.replace(/checkout\.html$/, "checkout-success.html")
        }
      });
    }
  </script>
</body>
</html>
